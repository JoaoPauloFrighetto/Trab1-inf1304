# SmartFactory Lab - Monitoramento de sensores com Kafka (cluster de 3 brokers em modo KRaft)
# Todos os valores configuráveis vêm do arquivo .env (sem constantes hard-coded).

# Configuração comum aos três brokers (cada um também é controller: broker,controller)
x-kafka-comum: &kafka-comum
  image: ${KAFKA_IMAGE}
  networks:
    - int-network
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}                      # mesmo ID nos 3 nós
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # Replicação dos tópicos internos e padrão dos tópicos
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR}
  KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
  KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR}
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  # O tópico é criado explicitamente pelo serviço kafka-init
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-1:
    <<: *kafka-comum
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-comum
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-comum
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Cria o tópico dados-sensores (partições + replicação) e termina
  kafka-init:
    image: ${KAFKA_IMAGE}
    restart: "no"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    networks:
      - int-network
    environment:
      BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      TOPICO: ${KAFKA_TOPIC}
      PARTICOES: ${KAFKA_PARTITIONS}
      REPLICACAO: ${KAFKA_REPLICATION_FACTOR}
      MIN_ISR: ${KAFKA_MIN_ISR}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists \
          --topic $$TOPICO --partitions $$PARTICOES --replication-factor $$REPLICACAO \
          --config min.insync.replicas=$$MIN_ISR
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --describe --topic $$TOPICO

  # Sensores (produtores): cada réplica é um sensor diferente
  sensor-producer:
    build: ./producer-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      INTERVALO_MS: ${INTERVALO_MS}
      PROB_ANOMALIA: ${PROB_ANOMALIA}
      SETORES: linha-producao,refrigeracao,empacotamento
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m
    deploy:
      replicas: ${SENSORES}
      resources:
        limits:
          memory: 256M
    networks:
      - int-network

  # Processadores (consumidores): todas as réplicas no mesmo grupo de consumo
  sensor-consumer:
    build: ./consumer-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}
      TEMP_MAX: ${TEMP_MAX}
      TEMP_CRITICA: ${TEMP_CRITICA}
      VIBRACAO_MAX: ${VIBRACAO_MAX}
      ENERGIA_MAX: ${ENERGIA_MAX}
      ALERTAS_ARQUIVO: /logs/alertas.jsonl
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m
    volumes:
      - ./logs:/logs
    deploy:
      replicas: ${CONSUMIDORES}
      resources:
        limits:
          memory: 256M
    networks:
      - int-network

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  int-network:
    driver: bridge
